<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Doador de Sangue — slide 01</title>
<link rel="stylesheet" href="styles.css">
<style>

  .capa-logo{margin-top:56px;}
  .data-gota{position:absolute;right:70px;bottom:20px;width:230px;height:299px;}

  .rodape .arraste{font-size:26px;}

<main class="slide bg-amarelo">
  <svg viewBox="0 0 100 130" class="ponte dir"><path d="M50 0C50 0 0 58 0 82a50 50 0 0 0 100 0C100 58 50 0 50 0Z"/></svg>
  <header class="topo"><span class="marca"><b>Medicina</b> · UNIPÊ</span><span class="contador">1/8</span></header>

  <span class="tag">25 de novembro</span>

  <div class="capa-logo"><div class="logo-slot">Logo<br>Cruzeiro do Sul</div></div>
  <div class="data-gota"><svg viewBox="0 0 100 130" class="gg"><path d="M50 0C50 0 0 58 0 82a50 50 0 0 0 100 0C100 58 50 0 50 0Z"/></svg><span>25<br><small>NOV</small></span></div>
</section>
  <footer class="rodape"><span class="tracejado"></span><div class="arraste">arraste <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div></footer>
</main>
