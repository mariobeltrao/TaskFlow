<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Ilustração: folha de respostas, caneta e relógio (paleta oficial) -->
  <g stroke="#013380" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="300" cy="310" r="270" fill="#FFED8E" stroke="none"/>
    <path d="M70 250v24M58 262h24M540 470v20M530 480h20" fill="none"/>

    <!-- folha de respostas -->
    <g transform="rotate(-8 280 330)">
      <rect x="140" y="130" width="280" height="370" rx="18" fill="#FFFFFF"/>
      <rect x="170" y="160" width="220" height="34" rx="8" fill="#DEDEDE"/>
      <g fill="#FFFFFF" stroke-width="5">
        <circle cx="190" cy="240" r="14" fill="#013380"/><circle cx="235" cy="240" r="14"/><circle cx="280" cy="240" r="14"/><circle cx="325" cy="240" r="14"/><circle cx="370" cy="240" r="14"/>
        <circle cx="190" cy="290" r="14"/><circle cx="235" cy="290" r="14"/><circle cx="280" cy="290" r="14" fill="#013380"/><circle cx="325" cy="290" r="14"/><circle cx="370" cy="290" r="14"/>
        <circle cx="190" cy="340" r="14"/><circle cx="235" cy="340" r="14" fill="#013380"/><circle cx="280" cy="340" r="14"/><circle cx="325" cy="340" r="14"/><circle cx="370" cy="340" r="14"/>
        <circle cx="190" cy="390" r="14"/><circle cx="235" cy="390" r="14"/><circle cx="280" cy="390" r="14"/><circle cx="325" cy="390" r="14" fill="#013380"/><circle cx="370" cy="390" r="14"/>
        <circle cx="190" cy="440" r="14"/><circle cx="235" cy="440" r="14"/><circle cx="280" cy="440" r="14"/><circle cx="325" cy="440" r="14"/><circle cx="370" cy="440" r="14"/>
      </g>
    </g>

    <!-- caneta (corpo transparente) -->
    <g transform="rotate(38 400 400)">
      <rect x="380" y="250" width="46" height="230" rx="12" fill="#FFFFFF"/>
      <rect x="397" y="262" width="12" height="200" rx="6" fill="#013380" stroke="none"/>
      <rect x="376" y="232" width="54" height="40" rx="10" fill="#FED500"/>
      <path d="M380 480l23 46 23-46z" fill="#DEDEDE"/>
    </g>

    <!-- relógio -->
    <circle cx="470" cy="160" r="72" fill="#FED500"/>
    <circle cx="470" cy="160" r="54" fill="#FFFFFF"/>
    <path d="M470 124v36l24 16" fill="none" stroke-width="8"/>
    <path d="M450 82h40M470 82v6" fill="none" stroke-width="8"/>
  </g>
</svg>
